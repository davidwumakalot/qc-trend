<style>

  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);

  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#046b04; --warn-ink:#8a5c00; --serious-ink:#a1441c; --crit-ink:#a52121;
  --shadow:0 1px 2px rgba(13,18,20,.05), 0 8px 24px -18px rgba(13,18,20,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0b0e0f; --surface:#181c1e; --surface-2:#1f2426;
    --ink:#f2f5f6; --ink-2:#a9b4bb; --muted:#7e8991;
    --grid:#252b2e; --axis:#394145; --hair:rgba(242,245,246,.12);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
    --ctx:#454f54;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e06b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0b0e0f; --surface:#181c1e; --surface-2:#1f2426;
  --ink:#f2f5f6; --ink-2:#a9b4bb; --muted:#7e8991;
  --grid:#252b2e; --axis:#394145; --hair:rgba(242,245,246,.12);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  --ctx:#454f54;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e06b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px}

/* ---------- masthead ---------- */
header.top{
  border-bottom:1px solid var(--hair); background:var(--surface);
  position:sticky; top:0; z-index:30;
}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.stamp{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;gap:14px;align-items:center}

/* ---------- filter rail ---------- */
.rail{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px 0 18px;
}
.field{display:flex;align-items:center;gap:7px}
.field > label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace}
select{
  font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--hair);border-radius:5px;padding:5px 8px;min-width:120px;
}
.segs{display:flex;border:1px solid var(--hair);border-radius:5px;overflow:hidden;background:var(--surface)}
.segs button{
  font:inherit;font-size:12.5px;padding:5px 11px;border:0;background:transparent;color:var(--ink-2);
  cursor:pointer;border-right:1px solid var(--hair);
}
.segs button:last-child{border-right:0}
.segs button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.segs button:hover:not([aria-pressed="true"]){background:var(--surface-2)}
button:focus-visible,select:focus-visible,summary:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clearbtn{
  font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--hair);border-radius:5px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;
}
.clearbtn:hover{background:var(--surface-2)}
.clearbtn[hidden]{display:none}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.tile .lab{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.tile .val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile.hero .val{font-size:42px}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .val small{font-size:.5em;font-weight:500;color:var(--muted);margin-left:2px}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:999px;line-height:1.6;
}
.pill svg{width:11px;height:11px;flex:none}
.p-good{color:var(--good-ink);background:color-mix(in srgb,var(--good) 15%,transparent)}
.p-warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 20%,transparent)}
.p-serious{color:var(--serious-ink);background:color-mix(in srgb,var(--serious) 20%,transparent)}
.p-crit{color:var(--crit-ink);background:color-mix(in srgb,var(--crit) 16%,transparent)}
.p-flat{color:var(--ink-2);background:var(--surface-2)}

/* ---------- cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--hair);border-radius:8px;
  padding:16px 18px 14px;box-shadow:var(--shadow);margin-bottom:12px;
}
.card h2{font-size:14px;font-weight:600;margin:0 0 2px}
.card h3{font-size:12.5px;font-weight:600;margin:14px 0 8px;color:var(--ink-2)}
.card h3:first-of-type{margin-top:4px}
.subrail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 6px}
.pickname{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.heat text{font-family:"IBM Plex Mono",monospace}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}
.card .note{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.scrollx{overflow-x:auto}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:3px;border-radius:2px;flex:none}
.legend .sw.rect{height:11px;width:11px;border-radius:2px}

/* ---------- tooltip ---------- */
.tip{
  position:absolute;pointer-events:none;z-index:20;opacity:0;transition:opacity .09s;
  background:var(--surface);border:1px solid var(--hair);border-radius:6px;
  box-shadow:0 4px 20px -6px rgba(0,0,0,.30);padding:8px 10px;min-width:150px;font-size:12px;
}
.tip.on{opacity:1}
.tip .th{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.tip .r{display:flex;align-items:center;gap:7px;padding:1.5px 0}
.tip .r .sw{width:11px;height:3px;border-radius:2px;flex:none}
.tip .r .v{font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.tip .r .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}

/* ---------- table ---------- */
details.tv{background:var(--surface);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow)}
details.tv > summary{
  cursor:pointer;padding:13px 18px;font-size:13.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.tv > summary::-webkit-details-marker{display:none}
details.tv > summary::before{content:"▸";color:var(--muted);font-size:11px}
details.tv[open] > summary::before{content:"▾"}
.tw{max-height:520px;overflow:auto;border-top:1px solid var(--hair)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
thead th{
  position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:600;
  font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr{cursor:pointer}

footer{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink-2);font-weight:600}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

try{ const s=localStorage.getItem('qc.lang'); if(s==='zh'||s==='en') LANG=s; }catch(e){}

const slotLabel=sl=>{
  const time=(DATA.meta.slot_times||{})[sl]||'';
  return t('slot_'+sl)+(time?' '+time:'');
};
/* data labels carry their own translations: [zh, en, local] */
const LX=()=>LANG==='en'?1:0;
function applyChrome(){
  document.documentElement.lang = LANG==='en'?'en':'zh-Hant';

  });

    if([3,5,7].includes(i)) th.className='n'; th.textContent=h; tr.appendChild(th);});

const SERIES=['--s1','--s2','--s3','--s4','--s5','--s6'];
const SLOT_COLOR={end:'--accent', mid:'--s2'};
const SVGNS='http://www.w3.org/2000/svg';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=v=>(v==null||isNaN(v))?'—':v.toFixed(2)+'%';
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;};
const txt=(o,t)=>{o.textContent=t; return o;};
const SEP='||';
function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e;
  const steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  return (steps.find(s=>m<=s+1e-9)||10)*e;
}

const RAMP=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5',
            '#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function lum(hex){const h=hex.replace('#','');
  const v=[0,2,4].map(i=>{let c=parseInt(h.substr(i,2),16)/255;
    return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);});
  return .2126*v[0]+.7152*v[1]+.0722*v[2];}
const isDark=()=>lum(cssv('--surface')||'#ffffff')<0.4;

const BANDS=[[15,'good'],[25,'warn'],[35,'serious'],[1e9,'crit']];
const band=r=>BANDS.find(b=>r<b[0]);
const bandName=r=>t('band_'+band(r)[1]);
/* each label ships as [zh, en, local]; fall back down the list */
const PN=r=>r.P[LX()]||r.P[0]||r.P[1]||'';
const IN=r=>r.I[LX()]||r.I[0]||r.I[1]||'';
const key=r=>r.line+' · '+r.style;

/* ---------------- state ---------------- */
const S={fac:null, days:0, slots:['end'], hi:[], pick:null, cells:[], cellsFor:null};
const primary=()=>['end','mid'].find(s=>S.slots.includes(s))||'end';

/* ---------------- derive ---------------- */
function build(){
  const all=DATA.rows.filter(r=>r.f===S.fac && S.slots.includes(r.s));
  let dates=[...new Set(all.map(r=>r.d))].sort();
  if(S.days>0) dates=dates.slice(-S.days);
  const keep=new Set(dates);
  const P=primary();

  const avgBySlot={};
  S.slots.forEach(sl=>{
    const per={}; dates.forEach(d=>per[d]=[]);
    all.filter(r=>r.s===sl && keep.has(r.d)).forEach(r=>per[r.d].push(r.rate));
    avgBySlot[sl]=dates.map(d=>per[d].length? per[d].reduce((a,b)=>a+b,0)/per[d].length : null);
  });

  const rows=DATA.rows.filter(r=>r.f===S.fac && r.s===P && keep.has(r.d));
  const det =DATA.det .filter(r=>r.f===S.fac && r.s===P && keep.has(r.d));
  const series={}; rows.forEach(r=>{(series[key(r)] ||= {})[r.d]=r.rate;});

  const pDates=dates.filter(d=>rows.some(r=>r.d===d));
  const latest=pDates[pDates.length-1];
  const latestRows=rows.filter(r=>r.d===latest).sort((a,b)=>b.rate-a.rate);
  const avgP=avgBySlot[P]||[];
  const li=dates.indexOf(latest);
  let prevAvg=null;
  for(let i=li-1;i>=0;i--){ if(avgP[i]!=null){prevAvg=avgP[i]; break;} }
  return {dates,rows,det,series,avgBySlot,primary:P,latest,latestRows,
          latestAvg:li>=0?avgP[li]:null, prevAvg};
}

/* ---------------- shared chart helpers ---------------- */
function dateTicks(n,gapPx,cb){
  const step = gapPx>=46 ? 1 : Math.max(1,Math.ceil(46/gapPx));
  for(let i=0;i<n;i++){ if(i%step===0 || i===n-1) cb(i); }
}
function tipbox(host){const d=document.createElement('div'); d.className='tip'; host.appendChild(d); return d;}
function place(tip,host,ev,dx){
  const r=host.getBoundingClientRect();
  tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,ev.clientX-r.left+(dx||12)))+'px';
  tip.style.top=Math.max(4,ev.clientY-r.top-tip.offsetHeight-10)+'px';
}
function tipHead(tip,t){const d=document.createElement('div'); d.className='th'; d.textContent=t;
  tip.appendChild(d);}
function tipRow(tip,color,name,value){
  const d=document.createElement('div'); d.className='r';
  const s=document.createElement('span'); s.className='sw'; s.style.background=color;
  const n=document.createElement('span'); n.className='n'; n.textContent=name;
  const v=document.createElement('span'); v.className='v'; v.textContent=value;
  d.append(s,n,v); tip.appendChild(d);
}
function legendInto(id,items,rect){
  const lg=document.getElementById(id); if(!lg) return; lg.textContent='';
  items.forEach(([c,t])=>{const k=document.createElement('span'); k.className='k';
    const s=document.createElement('span'); s.className='sw'+(rect?' rect':''); s.style.background=c;
    k.append(s,document.createTextNode(t)); lg.appendChild(k);});
}

/* Generic stacked-column chart: equal spacing, one column per report day. */
function stacked(hostId,legId,dates,cats,vals,opt){
  opt=opt||{};
  const host=document.getElementById(hostId); host.textContent='';
  if(legId) legendInto(legId,[]);
  if(!dates.length){host.innerHTML='<div class="empty">'+t('empty_range')+'</div>';return;}
  const W=opt.W||560, H=opt.H||260, mL=opt.mL||46, mR=8, mT=10, mB=30;
  const iw=W-mL-mR, ih=H-mT-mB, n=dates.length;
  const slot=iw/n, bw=Math.min(26,Math.max(3,slot-4));
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':opt.label||''},host);
  const pct=!!opt.percent;
  const totOf=d=>cats.reduce((s,c)=>s+((vals[d]&&vals[d][c])||0),0);
  const maxTot=pct?100:niceMax(Math.max(1,...dates.map(totOf)));
  const ticks=pct?[0,25,50,75,100]:[0,.25,.5,.75,1].map(f=>Math.round(maxTot*f));
  ticks.forEach(t=>{const y=mT+ih-ih*(t/maxTot);
    el('line',{x1:mL,x2:mL+iw,y1:y,y2:y,stroke:cssv('--grid'),'stroke-width':1},svg);
    txt(el('text',{x:mL-7,y:y+4,'text-anchor':'end',fill:cssv('--muted'),'font-size':10.5,
      'font-family':'IBM Plex Mono, monospace'},svg), pct?t+'%':t.toLocaleString());});
  const colors=cats.map((c,i)=> c===opt.otherLabel? cssv('--ctx') : cssv(SERIES[i%SERIES.length]));
  const tip=tipbox(host);
  dates.forEach((d,i)=>{
    const x=mL+slot*i+(slot-bw)/2, tot=totOf(d), g=el('g',{},svg);
    if(tot){
      let acc=0;
      cats.forEach((c,ci)=>{
        const v=(vals[d]&&vals[d][c])||0; if(!v)return;
        const h=ih*(pct? v/tot : v/maxTot), y=mT+ih-h-acc; acc+=h;
        el('rect',{x,y:y+1,width:bw,height:Math.max(0,h-2),fill:colors[ci],rx:1},g);
      });
    }
    el('rect',{x:x-2,y:mT,width:bw+4,height:ih,fill:'transparent'},g)
      .addEventListener('pointermove',ev=>{
        tip.textContent='';
        tipHead(tip, d+' · '+(tot?tf('total_units',tot.toLocaleString()):t('no_data')));
        cats.forEach((c,ci)=>{const v=(vals[d]&&vals[d][c])||0; if(!v)return;
          tipRow(tip,colors[ci],c, pct?(100*v/tot).toFixed(1)+'%':v.toLocaleString());});
        tip.classList.add('on'); place(tip,host,ev);
      });
    g.addEventListener('pointerleave',()=>tip.classList.remove('on'));
  });
  dateTicks(n,slot,i=>{
    let tx=mL+slot*i+slot/2, anchor='middle';
    if(tx+17>W){tx=W-1; anchor='end';} else if(tx-17<0){tx=1; anchor='start';}
    txt(el('text',{x:tx,y:H-10,'text-anchor':anchor,fill:cssv('--muted'),'font-size':10.5,
      'font-family':'IBM Plex Mono, monospace'},svg), dates[i].slice(5));
  });
  if(legId) legendInto(legId,cats.map((c,i)=>[colors[i],c]),true);
}

/* ---------------- kpi ---------------- */
function renderKpis(M){
  const box=document.getElementById('kpis'); box.textContent='';
  const mk=(lab,val,unit,subs,hero)=>{
    const d=document.createElement('div'); d.className='tile'+(hero?' hero':'');
    const l=document.createElement('div'); l.className='lab'; l.textContent=lab; d.append(l);
    const v=document.createElement('div'); v.className='val'; v.textContent=val;
    if(unit){const u=document.createElement('small'); u.textContent=unit; v.appendChild(u);}
    d.append(v);
    if(subs){const s=document.createElement('div'); s.className='sub'; subs.forEach(x=>s.append(x)); d.append(s);}
    box.appendChild(d);
  };
  const pill=(cls,t,icon)=>{const p=document.createElement('span'); p.className='pill '+cls;
    if(icon){const sv=document.createElementNS(SVGNS,'svg'); sv.setAttribute('viewBox','0 0 12 12');
      const pa=document.createElementNS(SVGNS,'path'); pa.setAttribute('fill','currentColor');
      pa.setAttribute('d',icon); sv.appendChild(pa); p.appendChild(sv);}
    p.appendChild(document.createTextNode(t)); return p;};
  const span=t=>txt(document.createElement('span'),t);
  const UP='M6 1.5 11 8H1z', DN='M6 10.5 1 4h10z', DOT='M6 3.8 8.2 6 6 8.2 3.8 6z';

  if(M.latestAvg!=null){
    const b=band(M.latestAvg), subs=[pill('p-'+b[1],bandName(M.latestAvg),DOT)];
    if(M.prevAvg!=null){const dl=M.latestAvg-M.prevAvg, up=dl>.05, dn=dl<-.05;
      subs.push(pill(up?'p-crit':dn?'p-good':'p-flat',
        (dl>0?'+':'')+dl.toFixed(2)+' '+t('vs_prev'), up?UP:dn?DN:DOT));}
    mk(t('k_avg')+' · '+M.latest+' '+slotLabel(M.primary), M.latestAvg.toFixed(2),'%',subs,true);
  }
  const w=M.latestRows[0];
  if(w) mk(t('k_worst'), w.rate.toFixed(2),'%',[span(key(w))]);
  mk(t('k_count'), String(M.latestRows.length),'',
     [span(M.dates.length+' '+t('days_from')+' '+(M.dates[0]||'')+' '+t('days_since'))]);
  const agg={}; M.det.forEach(r=>{const k=IN(r); agg[k]=(agg[k]||0)+r.iu;});
  const tot=Object.values(agg).reduce((a,b)=>a+b,0);
  const top=Object.entries(agg).sort((a,b)=>b[1]-a[1])[0];
  if(top) mk(t('k_topitem'),(100*top[1]/tot).toFixed(1),'%',
     [span(top[0]+' · '+top[1].toLocaleString()+' '+t('units'))]);
}

/* ---------------- trend ---------------- */
function renderTrend(M){
  const host=document.getElementById('c-trend'); host.textContent='';
  if(!M.dates.length){host.innerHTML='<div class="empty">'+t('empty_range')+'</div>';
    legendInto('l-trend',[]); return;}
  const W=1160,H=340,mL=48,mR=96,mT=14,mB=34, iw=W-mL-mR, ih=H-mT-mB, n=M.dates.length;
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':t('h_trend')},host);
  const X=i=> n===1 ? mL+iw/2 : mL+iw*i/(n-1);
  let maxV=0;
  Object.values(M.series).forEach(o=>Object.values(o).forEach(v=>{if(v>maxV)maxV=v;}));
  Object.values(M.avgBySlot).forEach(a=>a.forEach(v=>{if(v!=null&&v>maxV)maxV=v;}));
  maxV=Math.max(10,Math.ceil(maxV/10)*10);
  const Y=v=>mT+ih-ih*(v/maxV);

  for(let t=0;t<=maxV;t+=maxV/5){
    el('line',{x1:mL,x2:mL+iw,y1:Y(t),y2:Y(t),stroke:cssv('--grid'),'stroke-width':1},svg);
    txt(el('text',{x:mL-9,y:Y(t)+4,'text-anchor':'end',fill:cssv('--muted'),'font-size':11,
      'font-family':'IBM Plex Mono, monospace'},svg), t+'%');
  }
  dateTicks(n, n===1?iw:iw/(n-1), i=>txt(el('text',{x:X(i),y:H-11,'text-anchor':'middle',
    fill:cssv('--muted'),'font-size':11,'font-family':'IBM Plex Mono, monospace'},svg),
    M.dates[i].slice(5)));

  const path=vals=>{let d='',pen=false;
    vals.forEach((v,i)=>{if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i)+' '+Y(v); pen=true;});
    return d;};

  const ctx=cssv('--ctx'), hiSet=new Set(S.hi);
  Object.entries(M.series).forEach(([k,o])=>{
    if(hiSet.has(k))return;
    const d=path(M.dates.map(dt=>o[dt]==null?null:o[dt]));
    if(d) el('path',{d,fill:'none',stroke:ctx,'stroke-width':1,opacity:.55,'stroke-linejoin':'round'},svg);
    if(n===1){const v=o[M.dates[0]]; if(v!=null) el('circle',{cx:X(0),cy:Y(v),r:2.5,fill:ctx,opacity:.6},svg);}
  });
  S.hi.forEach((k,idx)=>{
    const o=M.series[k]; if(!o)return; const c=cssv(SERIES[idx%SERIES.length]);
    const d=path(M.dates.map(dt=>o[dt]==null?null:o[dt]));
    if(d) el('path',{d,fill:'none',stroke:c,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    M.dates.forEach((dt,i)=>{const v=o[dt]; if(v==null)return;
      el('circle',{cx:X(i),cy:Y(v),r:4,fill:c,stroke:cssv('--surface'),'stroke-width':2},svg);});
  });
  ['end','mid'].filter(sl=>S.slots.includes(sl)).forEach(sl=>{
    const a=M.avgBySlot[sl]||[], c=cssv(SLOT_COLOR[sl]), d=path(a);
    if(d) el('path',{d,fill:'none',stroke:c,'stroke-width':2.5,
      'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    let li=-1; a.forEach((v,i)=>{if(v!=null)li=i;});
    if(li>=0){
      el('circle',{cx:X(li),cy:Y(a[li]),r:4.5,fill:c,stroke:cssv('--surface'),'stroke-width':2},svg);
      txt(el('text',{x:X(li)+11,y:Y(a[li])+4,fill:cssv('--ink'),'font-size':12,'font-weight':600,
        stroke:cssv('--surface'),'stroke-width':3.5,'paint-order':'stroke',
        'font-family':'IBM Plex Mono, monospace'},svg), a[li].toFixed(1)+'%');
    }
  });
  if(n===1) txt(el('text',{x:mL+iw/2,y:mT+16,'text-anchor':'middle',fill:cssv('--muted'),
    'font-size':12},svg),t('one_day'));

  const cross=el('line',{x1:0,x2:0,y1:mT,y2:mT+ih,stroke:cssv('--axis'),'stroke-width':1,opacity:0},svg);
  const tip=tipbox(host);
  const hit=el('rect',{x:mL,y:mT,width:iw,height:ih,fill:'transparent'},svg);
  hit.addEventListener('pointermove',ev=>{
    const r=host.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;

}

function renderHeat(det,pTot,iTot,dates){
  const host=document.getElementById('c-heat'); host.textContent='';

  let rowsK=Object.entries(pTot).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  let colsK=Object.entries(iTot).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  /* a row or column with nothing in it inside this window is noise, not information */
  rowsK=rowsK.filter(p=>colsK.some(i=>cell[p+SEP+i]));

    document.getElementById('heat-hint').textContent=''; return;
  }
  let max=1;
  rowsK.forEach(p=>colsK.forEach(i=>{const v=cell[p+SEP+i]||0; if(v>max)max=v;}));

  const W=1160, mL=170, mT=66, ch=dates.length>1?48:30;

      transform:'rotate(-36 '+x+' '+(mT-12)+')'},svg);

    txt(el('text',{x:mL-10,y:y+ch/2+4,'text-anchor':'end',fill:cssv('--ink-2'),'font-size':11.5},svg),
        p.length>14?p.slice(0,14)+'…':p);
    colsK.forEach((c,j)=>{
      const ck=p+SEP+c, v=cell[ck]||0, x=mL+cw*j;
      const idx=v?Math.min(ramp.length-1,Math.floor(Math.pow(v/max,.6)*(ramp.length-1))):-1;
      const fill=idx<0?cssv('--surface-2'):ramp[idx];
      const g=el('g',{},svg);
      el('rect',{x:x+1,y:y+1,width:cw-2,height:ch-2,rx:2,fill:fill,
        stroke:idx<0?cssv('--grid'):'none','stroke-width':1},g);
      const ser=dates.map(d=>(daily[ck]&&daily[ck][d])||0);
      const dir=trendOf(ser);
      if(v){
        const ink=lum(ramp[idx])<.45?'#ffffff':'#0d1214';
        const ty=dates.length>1? y+17 : y+ch/2+4;
        txt(el('text',{x:x+cw/2,y:ty,'text-anchor':'middle','font-size':11,fill:ink,
          'font-weight':500},g), v.toLocaleString()+(dir.mark||''));
        if(dates.length>1){
          const mx=Math.max(...ser)||1, sw=cw-22, sx=x+11, sy=y+24, sh=15;
          let d2='';
          ser.forEach((val,si)=>{
            const px=sx+(ser.length===1?sw/2:sw*si/(ser.length-1));
            const py=sy+sh-sh*(val/mx);
            d2+=(si?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);});
          el('path',{d:d2,fill:'none',stroke:ink,'stroke-width':1.4,opacity:.6,
            'stroke-linejoin':'round','stroke-linecap':'round'},g);
          el('circle',{cx:sx+sw,cy:sy+sh-sh*(ser[ser.length-1]/mx),r:2,fill:ink,opacity:.9},g);
        }
      }
      if(S.cells.includes(ck))
        el('rect',{x:x+2,y:y+2,width:cw-4,height:ch-4,rx:2,fill:'none',
          stroke:cssv('--ink'),'stroke-width':2},g);
      if(v){
        g.style.cursor='pointer';
        g.setAttribute('tabindex','0'); g.setAttribute('role','button');
        g.setAttribute('aria-label',p+' × '+c+' '+v+' '+t('units'));
        const act=()=>{
          const i=S.cells.indexOf(ck);
          if(i>=0) S.cells.splice(i,1);
          else {if(S.cells.length>=6) S.cells.shift(); S.cells.push(ck);}
          render();

      }
      g.addEventListener('pointermove',ev=>{tip.textContent=''; tipHead(tip,p+' × '+c);
        tipRow(tip,idx<0?cssv('--ctx'):ramp[idx],t('period_total'),v.toLocaleString()+' '+t('units'));
        if(v&&dates.length>1){
          tipRow(tip,cssv(dir.up?'--crit':dir.down?'--good':'--ctx'),t('recent_trend'),dir.text);
          const d=document.createElement('div'); d.className='r';
          const n2=document.createElement('span'); n2.className='n'; n2.style.color=cssv('--muted');
          n2.textContent=t(S.cells.includes(ck)?'click_remove':'click_add');

  document.getElementById('heat-hint').textContent = tf('heat_hint', max.toLocaleString());
  renderCellTrend(dates,daily);
}

/* Direction of a daily series: mean of the later half vs the earlier half. */
function trendOf(ser){
  const n=ser.length;
  if(n<4) return {mark:'',text:t('tr_few'),up:false,down:false};
  const h=Math.floor(n/2);
  const a=ser.slice(0,h), b=ser.slice(n-h);
  const mean=x=>x.reduce((s,v)=>s+v,0)/x.length;
  const ma=mean(a), mb=mean(b);
  if(ma===0&&mb===0) return {mark:'',text:t('tr_zero'),up:false,down:false};
  const pct=ma===0?100:((mb-ma)/ma)*100;
  if(Math.abs(pct)<15) return {mark:'',text:tf('tr_flat',(pct>0?'+':'')+pct.toFixed(0)),up:false,down:false};
  const up=pct>0;
  return {mark:up?' ▲':' ▼', up:up, down:!up,
    text:tf(up?'tr_up':'tr_down', Math.abs(pct).toFixed(0), ma.toFixed(0), mb.toFixed(0))};
}

/* ---------------- table ---------------- */
function renderTable(M){
  const tb=document.getElementById('tb'); tb.textContent='';
  const byKey={};
  M.det.forEach(r=>{const k=r.d+'|'+r.line+'|'+r.style; if(!byKey[k])byKey[k]=[]; byKey[k].push(r);});
  const hiSet=new Set(S.hi);
  M.rows.slice().sort((a,b)=> a.d===b.d ? b.rate-a.rate : (a.d<b.d?1:-1)).forEach(r=>{
    const ds=byKey[r.d+'|'+r.line+'|'+r.style]||[], pos={}, item={};
    ds.forEach(x=>{const p=PN(x),i=IN(x);
      pos[p]=Math.max(pos[p]||0,x.pu); item[i]=(item[i]||0)+x.iu;});
    const tp=Object.entries(pos).sort((a,b)=>b[1]-a[1])[0];
    const ti=Object.entries(item).sort((a,b)=>b[1]-a[1])[0];
    const tr=document.createElement('tr'); tr.tabIndex=0;
    if(hiSet.has(key(r))) tr.className='sel';
    const td=(t,cls)=>{const c=document.createElement('td'); if(cls)c.className=cls;
      c.textContent=t; tr.appendChild(c);};
    td(r.d,'n'); td(r.line); td(r.style); td(r.rate.toFixed(2)+'%','n');
    td(tp?tp[0]:'—'); td(tp?tp[1].toLocaleString():'—','n');
    td(ti?ti[0]:'—'); td(ti?ti[1].toLocaleString():'—','n');
    const act=()=>{S.pick=key(r); toggle(key(r));};
    tr.addEventListener('click',act);
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();act();}});
    tb.appendChild(tr);
  });
}

  S.slots=['end','mid'].filter(k=>slots[k]!==undefined).slice(0,1);
  ['end','mid'].filter(k=>slots[k]!==undefined).forEach(k=>{
    const b=document.createElement('button'); b.dataset.s=k; b.textContent=slotLabel(k);
    if(S.slots.includes(k)) b.setAttribute('aria-pressed','true');
    b.addEventListener('click',()=>{
      const on=b.getAttribute('aria-pressed')==='true';
      if(on && S.slots.length===1) return;          /* never leave zero selected */
      if(on){S.slots=S.slots.filter(x=>x!==k); b.removeAttribute('aria-pressed');}
      else  {S.slots.push(k); b.setAttribute('aria-pressed','true');}
      render();
    });
    sc.appendChild(b);
  });

  document.querySelectorAll('#rng button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#rng button').forEach(x=>x.removeAttribute('aria-pressed'));
    b.setAttribute('aria-pressed','true'); S.days=+b.dataset.d; render();}));
  document.getElementById('clr').addEventListener('click',()=>{S.hi=[]; render();});
  document.getElementById('pick').addEventListener('change',e=>{S.pick=e.target.value; render();});
  document.querySelectorAll('#lang button').forEach(b=>{
    if(b.dataset.l===LANG) b.setAttribute('aria-pressed','true');
    else b.removeAttribute('aria-pressed');
    b.addEventListener('click',()=>{
      if(b.dataset.l===LANG) return;
      LANG=b.dataset.l;
      try{localStorage.setItem('qc.lang',LANG);}catch(e){}
      document.querySelectorAll('#lang button').forEach(x=>x.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed','true');
      document.querySelectorAll('#slot button').forEach(x=>{x.textContent=slotLabel(x.dataset.s);});
      applyChrome(); stampNow(); render();
    });
  });
  applyChrome(); stampNow();
  render();
  let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(render,180);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(render,60));
}
init();
</script>
