<title>EQC 三大瑕疵趨勢</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">

<style>
:root{
  color-scheme: light;
  --plane:#f2f5f6; --surface:#ffffff; --surface-2:#f7f9fa;
  --ink:#0d1214; --ink-2:#4d5860; --muted:#7e8991;
  --grid:#e5eaec; --axis:#c8d1d5; --hair:rgba(13,18,20,.10);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --ctx:#b6c0c5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#046b04; --warn-ink:#8a5c00; --serious-ink:#a1441c; --crit-ink:#a52121;
  --shadow:0 1px 2px rgba(13,18,20,.05), 0 8px 24px -18px rgba(13,18,20,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0b0e0f; --surface:#181c1e; --surface-2:#1f2426;
    --ink:#f2f5f6; --ink-2:#a9b4bb; --muted:#7e8991;
    --grid:#252b2e; --axis:#394145; --hair:rgba(242,245,246,.12);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
    --ctx:#454f54;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e06b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0b0e0f; --surface:#181c1e; --surface-2:#1f2426;
  --ink:#f2f5f6; --ink-2:#a9b4bb; --muted:#7e8991;
  --grid:#252b2e; --axis:#394145; --hair:rgba(242,245,246,.12);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  --ctx:#454f54;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --good-ink:#0ca30c; --warn-ink:#fab219; --serious-ink:#ec835a; --crit-ink:#e06b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 72px}

/* ---------- masthead ---------- */
header.top{
  border-bottom:1px solid var(--hair); background:var(--surface);
  position:sticky; top:0; z-index:30;
}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.stamp{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.stamp .dot{width:8px;height:8px;border-radius:50%;flex:none}
.stamp .strong{color:var(--ink-2);font-weight:600}
.sp-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;line-height:1.7;
  color:var(--serious-ink);background:color-mix(in srgb,var(--serious) 22%,transparent);
}
.segs button.sp[aria-pressed="true"]{background:var(--serious);color:#fff}
.stamp .warnbox{
  color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 20%,transparent);
  padding:1px 7px;border-radius:999px;font-weight:600;
}

/* ---------- filter rail ---------- */
.rail{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px 0 18px;
}
.field{display:flex;align-items:center;gap:7px}
.field > label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace}
select{
  font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--hair);border-radius:5px;padding:5px 8px;min-width:120px;
}
.segs{display:flex;border:1px solid var(--hair);border-radius:5px;overflow:hidden;background:var(--surface)}
.segs button{
  font:inherit;font-size:12.5px;padding:5px 11px;border:0;background:transparent;color:var(--ink-2);
  cursor:pointer;border-right:1px solid var(--hair);
}
.segs button:last-child{border-right:0}
.segs button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.segs button:hover:not([aria-pressed="true"]){background:var(--surface-2)}
button:focus-visible,select:focus-visible,summary:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clearbtn{
  font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--hair);border-radius:5px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;
}
.clearbtn:hover{background:var(--surface-2)}
.clearbtn[hidden]{display:none}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.tile .lab{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.tile .val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile.hero .val{font-size:42px}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .val small{font-size:.5em;font-weight:500;color:var(--muted);margin-left:2px}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:999px;line-height:1.6;
}
.pill svg{width:11px;height:11px;flex:none}
.p-good{color:var(--good-ink);background:color-mix(in srgb,var(--good) 15%,transparent)}
.p-warn{color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 20%,transparent)}
.p-serious{color:var(--serious-ink);background:color-mix(in srgb,var(--serious) 20%,transparent)}
.p-crit{color:var(--crit-ink);background:color-mix(in srgb,var(--crit) 16%,transparent)}
.p-flat{color:var(--ink-2);background:var(--surface-2)}

/* ---------- cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.card{min-width:0}
.chart{min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--hair);border-radius:8px;
  padding:16px 18px 14px;box-shadow:var(--shadow);margin-bottom:12px;
}
.card h2{font-size:14px;font-weight:600;margin:0 0 2px}
.card h3{font-size:12.5px;font-weight:600;margin:14px 0 8px;color:var(--ink-2)}
.card h3:first-of-type{margin-top:4px}
.subrail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 6px}
.pickname{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.heat text{font-family:"IBM Plex Mono",monospace}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}
.card .note{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
/* wide charts keep their designed size and scroll rather than shrinking the
   axis labels into illegibility */
.chart.scrollx svg{max-width:none}
.scrollx{overflow-x:auto}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:3px;border-radius:2px;flex:none}
.legend .sw.rect{height:11px;width:11px;border-radius:2px}

/* ---------- tooltip ---------- */
.tip{
  position:absolute;top:0;left:0;pointer-events:none;z-index:20;opacity:0;transition:opacity .09s;
  background:var(--surface);border:1px solid var(--hair);border-radius:6px;
  box-shadow:0 4px 20px -6px rgba(0,0,0,.30);padding:8px 10px;min-width:150px;font-size:12px;
}
.tip.on{opacity:1}
.tip .th{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.tip .r{display:flex;align-items:center;gap:7px;padding:1.5px 0}
.tip .r .sw{width:11px;height:3px;border-radius:2px;flex:none}
.tip .r .v{font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.tip .r .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}

/* ---------- table ---------- */
details.tv{background:var(--surface);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow)}
details.tv > summary{
  cursor:pointer;padding:13px 18px;font-size:13.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.tv > summary::-webkit-details-marker{display:none}
details.tv > summary::before{content:"▸";color:var(--muted);font-size:11px}
details.tv[open] > summary::before{content:"▾"}
.tw{max-height:520px;overflow:auto;border-top:1px solid var(--hair)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
thead th{
  position:sticky;top:0;background:var(--surface-2);z-index:2;font-weight:600;
  font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr{cursor:pointer}

footer{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink-2);font-weight:600}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- touch & small screens ---------- */
.tip{max-width:min(86vw,340px)}
.chart g[role="button"], .chart rect{ -webkit-tap-highlight-color:transparent }
@media (hover:none){
  /* fingers need bigger targets than a cursor does */
  .segs button{padding:9px 14px}
  .clearbtn{padding:9px 14px}
  select{padding:9px 10px;font-size:14px;min-height:38px}
  tbody td{padding:11px 12px}
  details.tv > summary{padding:15px 18px}
  .tip{font-size:13px;padding:10px 12px}
  .tip .r{padding:3px 0}
}
@media (max-width:760px){
  .wrap{padding:0 12px 48px}
  .card{padding:14px 12px 12px;border-radius:10px}
  /* a three-line sticky header eats a quarter of a phone screen */
  header.top{position:static}
  .top-in{padding:10px 12px;gap:6px}
  h1{font-size:15px}
  .eyebrow{font-size:9.5px;letter-spacing:.1em}
  .stamp{font-size:10.5px;width:100%;margin-left:0;flex-wrap:wrap;gap:6px}
  .rail{padding:10px 0 12px;gap:8px}
  .rail .field{margin-left:0!important}
  .kpis{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .tile{padding:11px 12px}
  .tile .val{font-size:24px}
  .tile.hero .val{font-size:30px}
  .tile .lab{font-size:11px}
  /* scale-to-fit would shrink axis text to nothing - scroll instead */
  .chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tw{max-height:60vh}
  .legend{font-size:11.5px;gap:5px 12px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:1fr}
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div>
        <div class="eyebrow">Makalot · EQC Daily</div>
        <h1 data-i18n="title">EQC 三大瑕疵趨勢</h1>
      </div>
    </div>
    <div class="stamp mono" id="stamp"></div>
  </div>
</header>

<div class="wrap">
  <div class="rail">
    <div class="field">
      <label for="fac" data-i18n="factory">廠別</label>
      <select id="fac"></select>
    </div>
    <div class="field">
      <label for="slot" data-i18n="shift">時段</label>
      <div class="segs" id="slot"></div>
    </div>
    <div class="field">
      <label for="sp" data-i18n="f_special">計算</label>
      <div class="segs" id="sp">
        <button class="sp" data-i18n="sp_btn" title="">特</button>
      </div>
    </div>
    <div class="field">
      <label for="rng" data-i18n="range">期間</label>
      <div class="segs" id="rng">
        <button data-d="3" data-i18n="d3">3 天</button>
        <button data-d="5" data-i18n="d5">5 天</button>
        <button data-d="0" aria-pressed="true" data-i18n="dall">全部</button>
      </div>
    </div>
    <button class="clearbtn" id="clr" hidden data-i18n="clear">清除選取線別</button>
    <div class="field" style="margin-left:auto">
      <div class="segs" id="lang">
        <button data-l="zh" aria-pressed="true">中文</button>
        <button data-l="en">English</button>
      </div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card" id="fac-card" hidden>
    <h2 data-i18n="h_facs">各廠比較</h2>
    <p class="note" data-i18n="note7"></p>
    <div class="grid2">
      <div>
        <h3 data-i18n="h_fac_trend">各廠每日平均不良率</h3>
        <div class="chart scrollx" id="c-fac-trend"></div>
        <div class="legend" id="l-fac"></div>
      </div>
      <div>
        <h3 data-i18n="h_fac_rank">各廠當日平均</h3>
        <div class="chart scrollx" id="c-fac-rank"></div>
        <div class="legend" id="l-fac-rank"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="h_trend">每日不良率走勢</h2>
    <p class="note" data-i18n="note1"></p>
    <div class="chart scrollx" id="c-trend"></div>
    <div class="legend" id="l-trend"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="h_lines">各線別當日不良率</span><span class="mono" id="latest-d" style="color:var(--muted);font-weight:400;font-size:12px"></span></h2>
    <p class="note" data-i18n="note2"></p>
    <div class="subrail">
      <div class="field">
        <label data-i18n="f_sort">排序</label>
        <div class="segs" id="sortby">
          <button data-k="rate" aria-pressed="true" data-i18n="sort_rate">依不良率</button>
          <button data-k="delta" data-i18n="sort_delta">依惡化幅度</button>
        </div>
      </div>
      <button class="clearbtn" id="hi-worst" data-i18n="hi_worst">highlight 惡化前 5</button>
    </div>
    <div class="chart scrollx" id="c-lines"></div>
    <div class="legend" id="l-lines"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2 data-i18n="h_pos">瑕疵部位趨勢</h2>
      <p class="note" data-i18n="note3"></p>
      <div class="chart scrollx" id="c-pos"></div>
      <div class="legend" id="l-pos"></div>
    </div>
    <div class="card">
      <h2 data-i18n="h_item">瑕疵項目趨勢</h2>
      <p class="note" data-i18n="note4"></p>
      <div class="chart scrollx" id="c-item"></div>
      <div class="legend" id="l-item"></div>
    </div>
  </div>

  <div class="card">
    <h2><span data-i18n="h_pick">單組交互分析</span><span class="pickname" id="pick-name"></span></h2>
    <p class="note" data-i18n="note5"></p>
    <div class="subrail">
      <div class="field">
        <label for="pick" data-i18n="group">組別</label>
        <select id="pick"></select>
      </div>
    </div>
    <div class="grid2">
      <div>
        <h3 data-i18n="h_ppos">每日瑕疵部位（不良件數）</h3>
        <div class="chart scrollx" id="c-p-pos"></div>
        <div class="legend" id="l-p-pos"></div>
      </div>
      <div>
        <h3 data-i18n="h_pitem">每日瑕疵項目（不良件數）</h3>
        <div class="chart scrollx" id="c-p-item"></div>
        <div class="legend" id="l-p-item"></div>
      </div>
    </div>
    <h3 data-i18n="h_heat">部位 × 瑕疵項目 交叉統計（期間合計不良件數）</h3>
    <div class="chart scrollx" id="c-heat"></div>
    <p class="hint" id="heat-hint"></p>
    <h3 data-i18n="h_cell">選定組合的每日趨勢（不良件數）</h3>
    <div class="chart scrollx" id="c-cell"></div>
    <div class="legend" id="l-cell"></div>
  </div>

  <div class="card">
    <h2><span data-i18n="h_look">瑕疵回溯分析</span><span class="pickname" id="look-name"></span></h2>
    <p class="note" data-i18n="note6"></p>
    <div class="subrail">
      <div class="field">
        <label for="lk-pos" data-i18n="f_pos">部位</label>
        <select id="lk-pos"></select>
      </div>
      <div class="field">
        <label for="lk-item" data-i18n="f_item">瑕疵項目</label>
        <select id="lk-item"></select>
      </div>
    </div>
    <div class="kpis" id="look-kpis"></div>
    <div class="grid2">
      <div>
        <h3 data-i18n="h_lk_rank">各組不良件數排名</h3>
        <div class="chart scrollx" id="c-lk-rank"></div>
        <p class="hint" data-i18n="lk_note_in_group"></p>
      </div>
      <div>
        <h3 data-i18n="h_lk_trend">每日件數走勢</h3>
        <div class="chart scrollx" id="c-lk-trend"></div>
        <div class="legend" id="l-lk-trend"></div>
      </div>
    </div>
  </div>

  <details class="tv">
    <summary data-i18n="h_table">明細表（Line × Style × 日期）</summary>
    <div class="tw">
      <table>
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </details>

  <footer id="foot"></footer>

const SERIES=['--s1','--s2','--s3','--s4','--s5','--s6'];

  for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e;};

function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e;
  const steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  return (steps.find(s=>m<=s+1e-9)||10)*e;
}

const RAMP=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5',
            '#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function lum(hex){const h=hex.replace('#','');
  const v=[0,2,4].map(i=>{let c=parseInt(h.substr(i,2),16)/255;
    return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);});
  return .2126*v[0]+.7152*v[1]+.0722*v[2];}
const isDark=()=>lum(cssv('--surface')||'#ffffff')<0.4;

/* Defect rate is defective units over inspected units - averaging the per-line
   percentages would let a 60-piece line outweigh a 4,000-piece one. */
function wavg(rows){
  let d=0,q=0;
  rows.forEach(r=>{ if(r.noqty) return; if(r.iq>0){ d+=r.du; q+=r.iq; } });
  if(q>0) return 100*d/q;
  /* nothing weightable in this slice (all rows predate the unit counts) -
     fall back to the plain mean rather than showing a blank */
  const a=rows.filter(r=>r.rate!=null);
  return a.length ? a.reduce((s,r)=>s+r.rate,0)/a.length : null;
}
const BANDS=[[15,'good'],[25,'warn'],[35,'serious'],[1e9,'crit']];
const band=r=>BANDS.find(b=>r<b[0]);
const bandName=r=>t('band_'+band(r)[1]);
/* each label ships as [zh, en, local]; fall back down the list */
const PN=r=>r.P[LX()]||r.P[0]||r.P[1]||'';
const IN=r=>r.I[LX()]||r.I[0]||r.I[1]||'';
const key=r=>r.line+' · '+r.style;

/* ---------------- state ---------------- */
const S={fac:null, days:0, slots:['end'], hi:[], pick:null, cells:[], cellsFor:null,
         lkPos:null, lkItem:null, sortBy:'rate', special:false};
/* The "特" basis halves the defect rate. Applying it once, to copies of the
   rows, keeps every downstream number consistent - per-line rates, the
   weighted average (du is halved with them), the deltas and the severity
   bands all follow without a second code path. */
function scaled(rows){
  if(!S.special) return rows;
  return rows.map(r=>Object.assign({},r,{rate:r.rate/2, du:(r.du||0)/2}));
}
const primary=()=>['end','mid'].find(s=>S.slots.includes(s))||'end';

/* ---------------- derive ---------------- */
function build(){
  const all=scaled(DATA.rows.filter(r=>r.f===S.fac && S.slots.includes(r.s)));
  let dates=[...new Set(all.map(r=>r.d))].sort();
  if(S.days>0) dates=dates.slice(-S.days);
  const keep=new Set(dates);
  const P=primary();

  const avgBySlot={};
  S.slots.forEach(sl=>{
    const per={}; dates.forEach(d=>per[d]=[]);
    all.filter(r=>r.s===sl && keep.has(r.d)).forEach(r=>per[r.d].push(r));
    avgBySlot[sl]=dates.map(d=>wavg(per[d]));
  });

  const rows=scaled(DATA.rows.filter(r=>r.f===S.fac && r.s===P && keep.has(r.d)));
  const det =DATA.det .filter(r=>r.f===S.fac && r.s===P && keep.has(r.d));
  const series={}; rows.forEach(r=>{(series[key(r)] ||= {})[r.d]=r.rate;});

  const pDates=dates.filter(d=>rows.some(r=>r.d===d));
  const latest=pDates[pDates.length-1];
  const latestRows=rows.filter(r=>r.d===latest).sort((a,b)=>b.rate-a.rate);
  /* change against that group's own previous report - level alone hides the
     line that jumped 20 points overnight */
  const prev={}, delta={};
  const seen={};
  dates.forEach(d=>{
    rows.filter(r=>r.d===d).forEach(r=>{
      const k=key(r);
      if(seen[k]!==undefined) {prev[k]=seen[k];}
      seen[k]=r.rate;
    });
  });
  latestRows.forEach(r=>{const k=key(r);
    delta[k] = prev[k]===undefined ? null : r.rate-prev[k];});

  const avgP=avgBySlot[P]||[];
  const li=dates.indexOf(latest);
  let prevAvg=null;
  for(let i=li-1;i>=0;i--){ if(avgP[i]!=null){prevAvg=avgP[i]; break;} }
  return {dates,rows,det,series,avgBySlot,primary:P,latest,latestRows,prev,delta,
          latestAvg:li>=0?avgP[li]:null, prevAvg};
}

function dateTicks(n,gapPx,cb){
  const step = gapPx>=46 ? 1 : Math.max(1,Math.ceil(46/gapPx));
  let last=-1;
  for(let i=0;i<n;i++){ if(i%step===0){ cb(i); last=i; } }
  /* the final date is worth showing, but not on top of the one before it */
  if(last!==n-1 && (n-1-last)*gapPx>=46) cb(n-1);
}
/* Touch devices have no hover, so a tap has to do the job: it replays the

   1160-wide drawing into 390px would leave the axis labels at ~4px. */

}

function series(svg, vals, X, Y, color, width, dotR){
  let d='', pen=false;
  vals.forEach((v,i)=>{ if(v==null){pen=false; return;} d+=(pen?'L':'M')+X(i)+' '+Y(v); pen=true; });
  if(d) el('path',{d,fill:'none',stroke:color,'stroke-width':width,
    'stroke-linejoin':'round','stroke-linecap':'round'},svg);
  vals.forEach((v,i)=>{
    if(v==null) return;
    const lone=(i===0||vals[i-1]==null)&&(i===vals.length-1||vals[i+1]==null);
    if(lone) el('circle',{cx:X(i),cy:Y(v),r:dotR||3.5,fill:color},svg);
  });

/* Generic stacked-column chart: equal spacing, one column per report day. */
function stacked(hostId,legId,dates,cats,vals,opt){
  opt=opt||{};
  const host=document.getElementById(hostId); host.textContent='';
  if(legId) legendInto(legId,[]);
  if(!dates.length){host.innerHTML='<div class="empty">'+t('empty_range')+'</div>';return;}
  const W=opt.W||fitW(host,300,560), nw=W<470, H=opt.H||(nw?230:260),
        mL=opt.mL||(nw?40:46), mR=8, mT=10, mB=30;
  const iw=W-mL-mR, ih=H-mT-mB, n=dates.length;
  const slot=iw/n, bw=Math.min(26,Math.max(3,slot-4));
  const svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-label':opt.label||''},host);
  const pct=!!opt.percent;
  const totOf=d=>cats.reduce((s,c)=>s+((vals[d]&&vals[d][c])||0),0);
  const maxTot=pct?100:niceMax(Math.max(1,...dates.map(totOf)));
  const ticks=pct?[0,25,50,75,100]:[0,.25,.5,.75,1].map(f=>Math.round(maxTot*f));
  ticks.forEach(t=>{const y=mT+ih-ih*(t/maxTot);
    el('line',{x1:mL,x2:mL+iw,y1:y,y2:y,stroke:cssv('--grid'),'stroke-width':1},svg);
    txt(el('text',{x:mL-7,y:y+4,'text-anchor':'end',fill:cssv('--muted'),'font-size':10.5,
      'font-family':'IBM Plex Mono, monospace'},svg), pct?t+'%':t.toLocaleString());});
  const colors=cats.map((c,i)=> c===opt.otherLabel? cssv('--ctx') : cssv(SERIES[i%SERIES.length]));
  const tip=tipbox(host);
  dates.forEach((d,i)=>{
    const x=mL+slot*i+(slot-bw)/2, tot=totOf(d), g=el('g',{},svg);

        const v=(vals[d]&&vals[d][c])||0; if(!v)return;
        const h=ih*(pct? v/tot : v/maxTot), y=mT+ih-h-acc; acc+=h;
        el('rect',{x,y:y+1,width:bw,height:Math.max(0,h-2),fill:colors[ci],rx:1},g);
      });
    }
    el('rect',{x:x-2,y:mT,width:bw+4,height:ih,fill:'transparent'},g)
      .addEventListener('pointermove',ev=>{
        tip.textContent='';
        tipHead(tip, d+' · '+(tot?tf('total_units',tot.toLocaleString()):t('no_data')));
        cats.forEach((c,ci)=>{const v=(vals[d]&&vals[d][c])||0; if(!v)return;
          /* both measures, leading with whichever one the chart is drawn in */
          const n=v.toLocaleString(), p=(100*v/tot).toFixed(1)+'%';
          tipRow(tip,colors[ci],c, pct ? p+' · '+n : n+' · '+p);});
        openTip(tip); place(tip,host,ev);
      });
    g.addEventListener('pointerleave',TOUCH?NOOP:()=>tip.classList.remove('on'));
  });
  dateTicks(n,slot,i=>{
    let tx=mL+slot*i+slot/2, anchor='middle';
    if(tx+17>W){tx=W-1; anchor='end';} else if(tx-17<0){tx=1; anchor='start';}
    txt(el('text',{x:tx,y:H-10,'text-anchor':anchor,fill:cssv('--muted'),'font-size':10.5,
      'font-family':'IBM Plex Mono, monospace'},svg), dates[i].slice(5));
  });
  if(legId) legendInto(legId,cats.map((c,i)=>[colors[i],c]),true);
}

/* ---------------- kpi ---------------- */
function renderKpis(M){
  const box=document.getElementById('kpis'); box.textContent='';
  const mk=(lab,val,unit,subs,hero)=>{
    const d=document.createElement('div'); d.className='tile'+(hero?' hero':'');
    const l=document.createElement('div'); l.className='lab'; l.textContent=lab; d.append(l);
    const v=document.createElement('div'); v.className='val'; v.textContent=val;
    if(unit){const u=document.createElement('small'); u.textContent=unit; v.appendChild(u);}
    d.append(v);
    if(subs){const s=document.createElement('div'); s.className='sub'; subs.forEach(x=>s.append(x)); d.append(s);}
    box.appendChild(d);
  };
  const pill=(cls,t,icon)=>{const p=document.createElement('span'); p.className='pill '+cls;
    if(icon){const sv=document.createElementNS(SVGNS,'svg'); sv.setAttribute('viewBox','0 0 12 12');
      const pa=document.createElementNS(SVGNS,'path'); pa.setAttribute('fill','currentColor');
      pa.setAttribute('d',icon); sv.appendChild(pa); p.appendChild(sv);}
    p.appendChild(document.createTextNode(t)); return p;};
  const span=t=>txt(document.createElement('span'),t);
  const UP='M6 1.5 11 8H1z', DN='M6 10.5 1 4h10z', DOT='M6 3.8 8.2 6 6 8.2 3.8 6z';

  if(M.latestAvg!=null){
    const b=band(M.latestAvg), subs=[pill('p-'+b[1],bandName(M.latestAvg),DOT)];
    if(M.prevAvg!=null){const dl=M.latestAvg-M.prevAvg, up=dl>.05, dn=dl<-.05;
      subs.push(pill(up?'p-crit':dn?'p-good':'p-flat',
        (dl>0?'+':'')+dl.toFixed(2)+' '+t('vs_prev'), up?UP:dn?DN:DOT));}
    mk(t('k_avg')+' · '+M.latest+' '+slotLabel(M.primary), M.latestAvg.toFixed(2),'%',subs,true);
  }
  const w=M.latestRows[0];
  if(w) mk(t('k_worst'), w.rate.toFixed(2),'%',[span(key(w))]);
  mk(t('k_count'), String(M.latestRows.length),'',
     [span(M.dates.length+' '+t('days_from')+' '+(M.dates[0]||'')+' '+t('days_since'))]);
  const agg={}; M.det.forEach(r=>{const k=IN(r); agg[k]=(agg[k]||0)+r.iu;});
  const tot=Object.values(agg).reduce((a,b)=>a+b,0);
  const top=Object.entries(agg).sort((a,b)=>b[1]-a[1])[0];
  if(top) mk(t('k_topitem'),(100*top[1]/tot).toFixed(1),'%',
     [span(top[0]+' · '+top[1].toLocaleString()+' '+t('units'))]);
}

/* ---------------- factory comparison ---------------- */
function renderFactories(){
  const card=document.getElementById('fac-card');
  const facs=[...new Set(DATA.rows.map(r=>r.f))].sort();
  if(facs.length<2){card.hidden=true; return;}
  card.hidden=false;

  const P=primary();
  const all=scaled(DATA.rows.filter(r=>r.s===P));
  let dates=[...new Set(all.map(r=>r.d))].sort();
  if(S.days>0) dates=dates.slice(-S.days);
  const keep=new Set(dates);

  const per={};                       // factory -> date -> rows
  all.forEach(r=>{ if(!keep.has(r.d)) return;
    if(!per[r.f]) per[r.f]={};
    (per[r.f][r.d] = per[r.f][r.d] || []).push(r); });
  const avg={}, lines={}, qty={};
  facs.forEach(f=>{
    avg[f]=dates.map(d=>wavg((per[f]&&per[f][d])||[]));
    lines[f]=Math.max(0,...dates.map(d=>((per[f]&&per[f][d])||[]).length));
    const last=dates.slice().reverse().find(d=>(per[f]&&per[f][d]||[]).length);
    qty[f]=((per[f]&&per[f][last])||[]).reduce((s,r)=>s+(r.iq||0),0);
  });
  const colorOf=f=>cssv(SERIES[facs.indexOf(f)%SERIES.length]);

  /* ---- daily average, one line per factory ---- */
  const host=document.getElementById('c-fac-trend'); host.textContent='';
  if(!dates.length){host.innerHTML='<div class="empty">'+t('empty_range')+'</div>';}
  else{
    const W=fitW(host,300,560), nw=W<470, H=nw?240:270, mL=nw?40:46, mR=nw?14:18,
          mT=12, mB=30, iw=W-mL-mR, ih=H-mT-mB, n=dates.length;
    const svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img',
      'aria-label':t('h_fac_trend')},host);
    const X=i=> n===1 ? mL+iw/2 : mL+iw*i/(n-1);
    let maxV=10; facs.forEach(f=>avg[f].forEach(v=>{if(v!=null&&v>maxV)maxV=v;}));
    maxV=Math.ceil(maxV/10)*10;
    const Y=v=>mT+ih-ih*(v/maxV);
    for(let v=0;v<=maxV;v+=maxV/5){
      el('line',{x1:mL,x2:mL+iw,y1:Y(v),y2:Y(v),stroke:cssv('--grid'),'stroke-width':1},svg);
      txt(el('text',{x:mL-7,y:Y(v)+4,'text-anchor':'end',fill:cssv('--muted'),'font-size':10.5,
        'font-family':'IBM Plex Mono, monospace'},svg), v+'%');}
    dateTicks(n, n===1?iw:iw/(n-1), i=>txt(el('text',{x:X(i),y:H-10,'text-anchor':'middle',
      fill:cssv('--muted'),'font-size':10.5,'font-family':'IBM Plex Mono, monospace'},svg),
      dates[i].slice(5)));
    facs.forEach(f=>{
      const g=el('g',{opacity:f===S.fac?1:.78},svg);
      series(g, avg[f], X, Y, colorOf(f), f===S.fac?2.6:1.6, 4);
    });
    const cross=el('line',{x1:0,x2:0,y1:mT,y2:mT+ih,stroke:cssv('--axis'),'stroke-width':1,opacity:0},svg);
    const tip=tipbox(host);
    el('rect',{x:mL,y:mT,width:iw,height:ih,fill:'transparent'},svg)
      .addEventListener('pointermove',ev=>{
        const r=host.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
        let i=0,bd=Infinity; for(let j=0;j<n;j++){const dd=Math.abs(X(j)-px); if(dd<bd){bd=dd;i=j;}}
        cross.setAttribute('opacity',1); cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i));
        tip.textContent=''; tipHead(tip,dates[i]);
        facs.map(f=>[f,avg[f][i]]).sort((a,b)=>(b[1]==null?-1:b[1])-(a[1]==null?-1:a[1]))
          .forEach(([f,v])=>tipRow(tip,colorOf(f),f, v==null?t('no_report'):fmt(v)));
        openTip(tip);
        const tw=tip.offsetWidth, left=X(i)/W*r.width;
        tip.style.left=Math.max(4,Math.min(r.width-tw-4,left+14))+'px';
        tip.style.top=Math.max(4,(ev.clientY-r.top)-tip.offsetHeight-14)+'px';});
    host.addEventListener('pointerleave',TOUCH?NOOP:()=>{cross.setAttribute('opacity',0);tip.classList.remove('on');});
  }
  legendInto('l-fac',facs.map(f=>[colorOf(f),f]));

  /* ---- today's average per factory ---- */
  const rh=document.getElementById('c-fac-rank'); rh.textContent='';
  const latest={};
  facs.forEach(f=>{for(let i=avg[f].length-1;i>=0;i--) if(avg[f][i]!=null){latest[f]={v:avg[f][i],d:dates[i]}; break;}});

  const H2=mT2+rank.length*rowH+6, iw2=W2-mL2-mR2;

  const svg2=el('svg',{width:W2,height:H2,viewBox:'0 0 '+W2+' '+H2,role:'img',
    'aria-label':t('h_fac_rank')},rh);
  for(let i=0;i<=5;i++){const x=mL2+iw2*i/5;
    el('line',{x1:x,x2:x,y1:mT2,y2:H2-6,stroke:cssv('--grid'),'stroke-width':1},svg2);}
  const tip2=tipbox(rh);
  rank.forEach((f,i)=>{
    const y=mT2+i*rowH, bh=15, w=Math.max(2,iw2*latest[f].v/maxR);
    const b=band(latest[f].v), c=cssv('--'+b[1]);
    const g=el('g',{tabindex:0,role:'button','aria-label':f+' '+fmt(latest[f].v)},svg2);
    g.style.cursor='pointer';
    el('rect',{x:mL2,y,width:iw2,height:rowH-2,fill:'transparent'},g);
    el('rect',{x:mL2,y:y+(rowH-2-bh)/2,width:w,height:bh,rx:4,fill:c,
      opacity:f===S.fac?1:.85},g);
    txt(el('text',{x:mL2-9,y:y+rowH/2+2,'text-anchor':'end','font-size':11.5,
      fill:f===S.fac?cssv('--ink'):cssv('--ink-2'),'font-weight':f===S.fac?600:400},g), f);
    txt(el('text',{x:mL2+w+7,y:y+rowH/2+2,'font-size':11.5,fill:cssv('--ink-2'),
      stroke:cssv('--surface'),'stroke-width':3.5,'paint-order':'stroke',
      'font-family':'IBM Plex Mono, monospace'},g), latest[f].v.toFixed(2)+'%');
    const act=()=>confirmTap('fac:'+f,()=>{
      if(f===S.fac) return;
      S.fac=f; S.hi=[]; S.pick=null; S.cells=[]; S.cellsFor=null;
      document.getElementById('fac').value=f; render();});
    g.addEventListener('click',act);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    g.addEventListener('pointermove',ev=>{
      tip2.textContent=''; tipHead(tip2,f+'  ·  '+latest[f].d);
      tipRow(tip2,c,bandName(latest[f].v),fmt(latest[f].v));
      tipRow(tip2,cssv('--ctx'),t('k_count'),lines[f]+' '+t('fac_lines'));
      if(qty[f]) tipRow(tip2,cssv('--ctx'),t('inspected'),qty[f].toLocaleString());
      tapHint(tip2); openTip(tip2); place(tip2,rh,ev,14);});
    g.addEventListener('pointerleave',TOUCH?NOOP:()=>tip2.classList.remove('on'));
  });
  legendInto('l-fac-rank',['good','warn','serious','crit'].map(k=>[cssv('--'+k),t('band_'+k+'_l')]),true);
}

    const a=M.avgBySlot[sl]||[], c=cssv(SLOT_COLOR[sl]);
    series(svg, a, X, Y, c, 2.5, 4.5);
    let li=-1; a.forEach((v,i)=>{if(v!=null)li=i;});
    if(li>=0){
      el('circle',{cx:X(li),cy:Y(a[li]),r:4.5,fill:c,stroke:cssv('--surface'),'stroke-width':2},svg);
      txt(el('text',{x:X(li)+11,y:Y(a[li])+4,fill:cssv('--ink'),'font-size':12,'font-weight':600,
        stroke:cssv('--surface'),'stroke-width':3.5,'paint-order':'stroke',
        'font-family':'IBM Plex Mono, monospace'},svg), a[li].toFixed(1)+'%');

    'font-size':12},svg),t('one_day'));

  const cross=el('line',{x1:0,x2:0,y1:mT,y2:mT+ih,stroke:cssv('--axis'),'stroke-width':1,opacity:0},svg);

    cross.setAttribute('opacity',1); cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i));
    tip.textContent=''; tipHead(tip,M.dates[i]);
    ['end','mid'].filter(sl=>S.slots.includes(sl)).forEach(sl=>
      tipRow(tip,cssv(SLOT_COLOR[sl]),slotLabel(sl)+' '+t('avg_suffix'),
             fmt(M.avgBySlot[sl]?M.avgBySlot[sl][i]:null)));
    S.hi.forEach((k,idx)=>tipRow(tip,cssv(SERIES[idx%SERIES.length]),k,
      fmt(M.series[k]?M.series[k][M.dates[i]]:null)));
    if(!S.hi.length){
      const day=M.rows.filter(r=>r.d===M.dates[i]).sort((a,b)=>b.rate-a.rate);
      day.slice(0,3).forEach(r=>tipRow(tip,ctx,key(r),fmt(r.rate)));
      if(day.length>3){const d=document.createElement('div'); d.className='r';

  hit.addEventListener('pointerleave',TOUCH?NOOP:()=>{cross.setAttribute('opacity',0);tip.classList.remove('on');});

  S.hi.forEach((k,i)=>items.push([cssv(SERIES[i%SERIES.length]),k]));
  items.push([ctx,t('rest_lines')+' · '+slotLabel(M.primary)]);
  legendInto('l-trend',items);
}

/* ---------------- line comparison ---------------- */
function renderLines(M){
  const host=document.getElementById('c-lines'); host.textContent='';
  document.getElementById('latest-d').textContent=M.latest?'　'+M.latest:'';
  if(!M.latestRows.length){host.innerHTML='<div class="empty">'+t('empty_range')+'</div>';
    legendInto('l-lines',[]); return;}
  const W=fitW(host,600,1160), nw=W<760, mL=nw?110:190,
        dW=nw?54:74, numW=nw?42:48,          /* mini-bar zone, then the number */
        mR=(nw?48:64)+dW+numW+8, mT=24, rowH=nw?28:26;
  const rows=M.latestRows.slice().sort((a,b)=>{
    if(S.sortBy!=='delta') return b.rate-a.rate;
    const da=M.delta[key(a)], db=M.delta[key(b)];
    if(da==null&&db==null) return b.rate-a.rate;
    if(da==null) return 1;
    if(db==null) return -1;
    return db-da;
  });
  /* one line jumping 30 points would flatten everyone else's bar to nothing,
     so scale to the 90th percentile and let the rare outlier peg the end */
  const mags=Object.values(M.delta).filter(v=>v!=null).map(Math.abs).sort((a,b)=>a-b);
  const maxD=Math.max(2, mags.length? mags[Math.floor(mags.length*0.9)] : 2);
  const H=mT+rows.length*rowH+8, iw=W-mL-mR;
  const maxV=Math.max(10,Math.ceil(Math.max(...rows.map(r=>r.rate))/10)*10);
  const svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-label':t('h_lines')},host);
  for(let t=0;t<=maxV;t+=maxV/5){const x=mL+iw*t/maxV;
    el('line',{x1:x,x2:x,y1:mT,y2:H-8,stroke:cssv('--grid'),'stroke-width':1},svg);}
  const tip=tipbox(host), hiSet=new Set(S.hi);
  rows.forEach((r,i)=>{
    const y=mT+i*rowH, bh=14, w=Math.max(2,iw*r.rate/maxV), k=key(r);
    const b=band(r.rate), c=cssv('--'+b[1]), bn=bandName(r.rate);
    const g=el('g',{tabindex:0,role:'button','aria-label':k+' '+fmt(r.rate)},svg);
    g.style.cursor='pointer';
    el('rect',{x:mL,y,width:iw,height:rowH-2,fill:'transparent'},g);
    const dim=hiSet.size&&!hiSet.has(k)?.45:1;
    el('rect',{x:mL,y:y+(rowH-2-bh)/2,width:w,height:bh,rx:4,fill:c,opacity:dim},g);
    el('rect',{x:mL,y:y+(rowH-2-bh)/2,width:Math.min(4,w),height:bh,fill:c,opacity:dim},g);
    txt(el('text',{x:mL-10,y:y+rowH/2+2,'text-anchor':'end','font-size':11.5,
      fill:hiSet.has(k)?cssv('--ink'):cssv('--ink-2'),
      'font-weight':hiSet.has(k)?600:400},g), k);
    txt(el('text',{x:mL+w+8,y:y+rowH/2+2,'font-size':11.5,fill:cssv('--ink-2'),
      stroke:cssv('--surface'),'stroke-width':3.5,'paint-order':'stroke',
      'font-family':'IBM Plex Mono, monospace'},g), r.rate.toFixed(2)+'%');

    /* change column: a short bar either side of a zero rule, so the size of
       the move is visible without reading the number */
    const dv=M.delta[k], dx0=W-numW-dW-2, mid=dx0+dW/2, half=dW/2-2;
    el('line',{x1:mid,x2:mid,y1:y+3,y2:y+rowH-5,stroke:cssv('--axis'),'stroke-width':1},g);
    if(dv!=null){
      const up=dv>0.05, dn=dv<-0.05;
      const dc=cssv(up?'--crit':dn?'--good':'--ctx');
      const over=Math.abs(dv)>maxD;
      const dw=Math.min(half,half*Math.abs(dv)/maxD);

/* ---------------- per-group cross analysis ---------------- */
function posUnitsByDate(det){        /* position units repeat on each item row */
  const m={};
  det.forEach(r=>{if(!m[r.d]) m[r.d]={}; const k=PN(r); m[r.d][k]=Math.max(m[r.d][k]||0,r.pu);});
  return m;
}

        if(dates.length>1){

/* Direction of a daily series: mean of the later half vs the earlier half. */
function trendOf(ser){
  const n=ser.length;
  if(n<4) return {mark:'',text:t('tr_few'),up:false,down:false};
  const h=Math.floor(n/2);
  const a=ser.slice(0,h), b=ser.slice(n-h);
  const mean=x=>x.reduce((s,v)=>s+v,0)/x.length;
  const ma=mean(a), mb=mean(b);
  if(ma===0&&mb===0) return {mark:'',text:t('tr_zero'),up:false,down:false};
  const pct=ma===0?100:((mb-ma)/ma)*100;
  if(Math.abs(pct)<15) return {mark:'',text:tf('tr_flat',(pct>0?'+':'')+pct.toFixed(0)),up:false,down:false};
  const up=pct>0;
  return {mark:up?' ▲':' ▼', up:up, down:!up,
    text:tf(up?'tr_up':'tr_down', Math.abs(pct).toFixed(0), ma.toFixed(0), mb.toFixed(0))};
}

/* ---------------- defect lookup: which groups have this problem ---------------- */
function renderLookup(M){
  const ALL='\u0000ALL';
  const posSel=document.getElementById('lk-pos'), itemSel=document.getElementById('lk-item');
  const rank=(get)=>{const m={}; M.det.forEach(r=>{const k=get(r); m[k]=(m[k]||0)+r.iu;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);};
  const fill=(sel,list,cur)=>{
    sel.textContent='';
    const o0=document.createElement('option'); o0.value=ALL; o0.textContent=t('all_opt');
    sel.appendChild(o0);
    list.forEach(v=>{const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);});
    sel.value = list.includes(cur)?cur:ALL;
    return sel.value;
  };
  S.lkPos=fill(posSel,rank(PN),S.lkPos);
  S.lkItem=fill(itemSel,rank(IN),S.lkItem);

  const hit=M.det.filter(r=>(S.lkPos===ALL||PN(r)===S.lkPos)&&(S.lkItem===ALL||IN(r)===S.lkItem));
  const allUnits=M.det.reduce((s,r)=>s+r.iu,0);
  const selUnits=hit.reduce((s,r)=>s+r.iu,0);

  const groups={}, dates=M.dates.filter(d=>hit.some(r=>r.d===d));
  hit.forEach(r=>{const k=key(r);
    if(!groups[k]) groups[k]={units:0,daily:{}};
    groups[k].units+=r.iu;
    groups[k].daily[r.d]=(groups[k].daily[r.d]||0)+r.iu;});
  const ranked=Object.entries(groups).sort((a,b)=>b[1].units-a[1].units);
  const lastRate={}; M.rows.forEach(r=>{lastRate[key(r)]=r.rate;});
  const groupAll={}; M.det.forEach(r=>{const k=key(r); groupAll[k]=(groupAll[k]||0)+r.iu;});

  const label=[S.lkPos===ALL?null:S.lkPos, S.lkItem===ALL?null:S.lkItem]
    .filter(Boolean).join(' × ') || t('all_opt');
  document.getElementById('look-name').textContent=label;

  /* summary tiles */
  const box=document.getElementById('look-kpis'); box.textContent='';
  const tile=(lab,val,unit,sub)=>{
    const d=document.createElement('div'); d.className='tile';
    const l=document.createElement('div'); l.className='lab'; l.textContent=lab;
    const v=document.createElement('div'); v.className='val'; v.textContent=val;
    if(unit){const u=document.createElement('small'); u.textContent=unit; v.appendChild(u);}
    d.append(l,v);
    if(sub){const s=document.createElement('div'); s.className='sub'; s.textContent=sub; d.append(s);}
    box.appendChild(d);
  };
  tile(t('lk_groups'), String(ranked.length),'', dates.length? dates[0]+' ~ '+dates[dates.length-1] : '');
  tile(t('lk_units'), selUnits.toLocaleString(),'', t('units'));
  tile(t('lk_share'), allUnits? (100*selUnits/allUnits).toFixed(1):'0','%',
       selUnits.toLocaleString()+' / '+allUnits.toLocaleString());
  if(ranked.length) tile(t('lk_worst'), ranked[0][1].units.toLocaleString(),'',
       ranked[0][0]+'  ·  '+(100*ranked[0][1].units/selUnits).toFixed(1)+'%');

  renderLkRank(ranked, selUnits, lastRate, groupAll);
  renderLkTrend(ranked, dates);
}

    grp.addEventListener('click',act);
    grp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    grp.addEventListener('pointermove',ev=>{
      tip.textContent=''; tipHead(tip,k);
      tipRow(tip,c,t('units'),g.units.toLocaleString());
      tipRow(tip,c,t('lk_of_sel'),(100*g.units/selUnits).toFixed(1)+'%');
      const gt=groupAll[k]||0;
      if(gt) tipRow(tip,cssv('--s3'),t('lk_in_group'),(100*g.units/gt).toFixed(1)+'%');
      if(lastRate[k]!=null)
        tipRow(tip,cssv('--'+band(lastRate[k])[1]),t('lk_group_rate'),fmt(lastRate[k]));
      const ser=Object.keys(g.daily).sort().map(d=>g.daily[d]);
      const dir=trendOf(ser);
      tipRow(tip,cssv(dir.up?'--crit':dir.down?'--good':'--ctx'),t('recent_trend'),dir.text);
      tapHint(tip); openTip(tip); place(tip,host,ev,14);});
    grp.addEventListener('pointerleave',TOUCH?NOOP:()=>tip.classList.remove('on'));
  });
}

function renderLkTrend(ranked, dates){
  const host=document.getElementById('c-lk-trend'); host.textContent='';
  if(!ranked.length||!dates.length){
    host.innerHTML='<div class="empty">'+t('lk_none')+'</div>'; legendInto('l-lk-trend',[]); return;}
  const W=fitW(host,300,560), nw=W<470, H=nw?240:280, mL=nw?42:48, mR=16,
        mT=12, mB=30, iw=W-mL-mR, ih=H-mT-mB, n=dates.length;
  const svg=el('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-label':t('h_lk_trend')},host);
  const X=i=> n===1 ? mL+iw/2 : mL+iw*i/(n-1);
  const total=dates.map(d=>ranked.reduce((s,[,g])=>s+(g.daily[d]||0),0));
  const top=ranked.slice(0,5);
  const maxV=niceMax(Math.max(1,...total));
  const Y=v=>mT+ih-ih*(v/maxV);
  [0,.25,.5,.75,1].forEach(f=>{const v=maxV*f;
    el('line',{x1:mL,x2:mL+iw,y1:Y(v),y2:Y(v),stroke:cssv('--grid'),'stroke-width':1},svg);
    txt(el('text',{x:mL-8,y:Y(v)+4,'text-anchor':'end',fill:cssv('--muted'),'font-size':10.5,
      'font-family':'IBM Plex Mono, monospace'},svg), Math.round(v).toLocaleString());});
  dateTicks(n, n===1?iw:iw/(n-1), i=>txt(el('text',{x:X(i),y:H-10,'text-anchor':'middle',
    fill:cssv('--muted'),'font-size':10.5,'font-family':'IBM Plex Mono, monospace'},svg),
    dates[i].slice(5)));
  const line=(vals,color,width)=>{
    let d=''; vals.forEach((v,i)=>{d+=(i?'L':'M')+X(i)+' '+Y(v);});
    el('path',{d,fill:'none',stroke:color,'stroke-width':width,
      'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    if(n===1) vals.forEach((v,i)=>el('circle',{cx:X(i),cy:Y(v),r:4,fill:color},svg));
  };
  top.forEach(([k,g],i)=>line(dates.map(d=>g.daily[d]||0),cssv(SERIES[(i+1)%SERIES.length]),1.6));
  line(total,cssv('--accent'),2.5);

  const cross=el('line',{x1:0,x2:0,y1:mT,y2:mT+ih,stroke:cssv('--axis'),'stroke-width':1,opacity:0},svg);
  const tip=tipbox(host);
  el('rect',{x:mL,y:mT,width:iw,height:ih,fill:'transparent'},svg)
    .addEventListener('pointermove',ev=>{
      const r=host.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
      let i=0,bd=Infinity; for(let j=0;j<n;j++){const dd=Math.abs(X(j)-px); if(dd<bd){bd=dd;i=j;}}
      cross.setAttribute('opacity',1); cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i));
      tip.textContent=''; tipHead(tip,dates[i]);
      tipRow(tip,cssv('--accent'),t('lk_total'),total[i].toLocaleString());
      top.forEach(([k,g],j)=>{const v=g.daily[dates[i]]||0; if(!v)return;
        tipRow(tip,cssv(SERIES[(j+1)%SERIES.length]),k,
          v.toLocaleString()+' \u00b7 '+(total[i]?(100*v/total[i]).toFixed(0):0)+'%');});
      openTip(tip);
      const tw=tip.offsetWidth, left=X(i)/W*r.width;
      tip.style.left=Math.max(4,Math.min(r.width-tw-4,left+14))+'px';
      tip.style.top=Math.max(4,(ev.clientY-r.top)-tip.offsetHeight-14)+'px';});
  host.addEventListener('pointerleave',TOUCH?NOOP:()=>{cross.setAttribute('opacity',0);tip.classList.remove('on');});
  legendInto('l-lk-trend',[[cssv('--accent'),t('lk_total')]].concat(
    top.map(([k],i)=>[cssv(SERIES[(i+1)%SERIES.length]),k])));
}

/* ---------------- table ---------------- */
function renderTable(M){
  const tb=document.getElementById('tb'); tb.textContent='';
  const byKey={};
  M.det.forEach(r=>{const k=r.d+'|'+r.line+'|'+r.style; if(!byKey[k])byKey[k]=[]; byKey[k].push(r);});
  const hiSet=new Set(S.hi);
  M.rows.slice().sort((a,b)=> a.d===b.d ? b.rate-a.rate : (a.d<b.d?1:-1)).forEach(r=>{
    const ds=byKey[r.d+'|'+r.line+'|'+r.style]||[], pos={}, item={};
    ds.forEach(x=>{const p=PN(x),i=IN(x);
      pos[p]=Math.max(pos[p]||0,x.pu); item[i]=(item[i]||0)+x.iu;});
    const tp=Object.entries(pos).sort((a,b)=>b[1]-a[1])[0];
    const ti=Object.entries(item).sort((a,b)=>b[1]-a[1])[0];
    const tr=document.createElement('tr'); tr.tabIndex=0;
    if(hiSet.has(key(r))) tr.className='sel';
    const td=(t,cls)=>{const c=document.createElement('td'); if(cls)c.className=cls;
      c.textContent=t; tr.appendChild(c);};
    td(r.d,'n'); td(r.line); td(r.style); td(r.rate.toFixed(2)+'%','n');
    td(tp?tp[0]:'—'); td(tp?tp[1].toLocaleString():'—','n');
    td(ti?ti[0]:'—'); td(ti?ti[1].toLocaleString():'—','n');
    const act=()=>confirmTap('row:'+key(r),()=>{S.pick=key(r); toggle(key(r));});
    tr.addEventListener('click',act);
    tr.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();act();}});
    tb.appendChild(tr);
  });
}

/* ---------------- orchestration ---------------- */
function toggle(k){
  const i=S.hi.indexOf(k);
  if(i>=0) S.hi.splice(i,1); else {if(S.hi.length>=6) S.hi.shift(); S.hi.push(k);}
  render();
}
function render(){
  const M=build();
  document.getElementById('clr').hidden=!S.hi.length;
  renderKpis(M); renderFactories(); renderTrend(M); renderLines(M);
  renderShare('c-pos','l-pos',M,PN,t('h_pos'));
  renderShare('c-item','l-item',M,IN,t('h_item'));
  renderPick(M); renderLookup(M); renderTable(M);
}
function stampNow(){
  const box=document.getElementById('stamp'); box.textContent='';
  const latest=[...new Set(DATA.rows.map(r=>r.d))].sort().pop()||'—';
  // days between the newest report and today; the evening report means one
  // day behind is the normal morning state, not staleness
  const today=new Date(); today.setHours(0,0,0,0);
  const lag=latest==='—'?99:Math.round((today-new Date(latest+'T00:00:00'))/864e5);
  const stale=lag>1;
  const dot=document.createElement('span');
  dot.className='dot';
  dot.style.background=cssv(stale?(lag>3?'--crit':'--warn'):'--good');
  dot.title=stale?tf('fresh_old',lag):t('fresh_ok');
  box.appendChild(dot);
  const add=(txt,cls)=>{const s=document.createElement('span');
    if(cls) s.className=cls; s.textContent=txt; box.appendChild(s); return s;};
  if(S.special){
    const sp=document.createElement('span'); sp.className='sp-badge';
    sp.textContent=t('sp_on'); box.appendChild(sp);
  }
  const rel = lag===0?t('fresh_today') : lag===1?t('fresh_yday') : '';
  add(t('data_upto')+' ');
  add(latest+(rel?'（'+rel+'）':''),'strong');
  if(stale) add(tf('fresh_old',lag),'warnbox');
  add('·');
  add(t('built_at')+' '+DATA.meta.generated);
  add('·');
  add(DATA.meta.days+' '+t('days_word'));
  add('· v4');
}
function init(){
  const facs=[...new Set(DATA.rows.map(r=>r.f))].sort();
  const sel=document.getElementById('fac');
  facs.forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=f; sel.appendChild(o);});
  S.fac=facs[0]; sel.value=S.fac;
  sel.addEventListener('change',()=>{S.fac=sel.value; S.hi=[]; S.pick=null; render();});

  const slots=DATA.meta.slot_times||{end:''};
  const sc=document.getElementById('slot');
  S.slots=['end','mid'].filter(k=>slots[k]!==undefined).slice(0,1);
  ['end','mid'].filter(k=>slots[k]!==undefined).forEach(k=>{
    const b=document.createElement('button'); b.dataset.s=k; b.textContent=slotLabel(k);
    if(S.slots.includes(k)) b.setAttribute('aria-pressed','true');
    b.addEventListener('click',()=>{
      const on=b.getAttribute('aria-pressed')==='true';
      if(on && S.slots.length===1) return;          /* never leave zero selected */
      if(on){S.slots=S.slots.filter(x=>x!==k); b.removeAttribute('aria-pressed');}
      else  {S.slots.push(k); b.setAttribute('aria-pressed','true');}
      render();
    });
    sc.appendChild(b);
  });

  document.querySelectorAll('#rng button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#rng button').forEach(x=>x.removeAttribute('aria-pressed'));
    b.setAttribute('aria-pressed','true'); S.days=+b.dataset.d; render();}));
  document.getElementById('clr').addEventListener('click',()=>{S.hi=[]; render();});
  document.getElementById('pick').addEventListener('change',e=>{S.pick=e.target.value; render();});
  const spb=document.querySelector('#sp button');
  spb.title=t('sp_title');
  spb.addEventListener('click',()=>{
    S.special=!S.special;
    if(S.special) spb.setAttribute('aria-pressed','true'); else spb.removeAttribute('aria-pressed');
    stampNow(); render();});
  document.querySelectorAll('#sortby button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#sortby button').forEach(x=>x.removeAttribute('aria-pressed'));
    b.setAttribute('aria-pressed','true'); S.sortBy=b.dataset.k; render();}));
  document.getElementById('hi-worst').addEventListener('click',()=>{
    const M=build();
    S.hi=M.latestRows.map(r=>[key(r),M.delta[key(r)]])
      .filter(x=>x[1]!=null&&x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
    render();
    document.getElementById('c-trend').scrollIntoView({behavior:'smooth',block:'center'});});
  document.getElementById('lk-pos').addEventListener('change',e=>{S.lkPos=e.target.value; render();});
  document.getElementById('lk-item').addEventListener('change',e=>{S.lkItem=e.target.value; render();});
  document.querySelectorAll('#lang button').forEach(b=>{
    if(b.dataset.l===LANG) b.setAttribute('aria-pressed','true');
    else b.removeAttribute('aria-pressed');
    b.addEventListener('click',()=>{
      if(b.dataset.l===LANG) return;
      LANG=b.dataset.l;
      try{localStorage.setItem('qc.lang',LANG);}catch(e){}
      document.querySelectorAll('#lang button').forEach(x=>x.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed','true');
      document.querySelectorAll('#slot button').forEach(x=>{x.textContent=slotLabel(x.dataset.s);});
      applyChrome(); document.querySelector('#sp button').title=t('sp_title');
      stampNow(); render();
    });
  });
  applyChrome(); stampNow();
  render();
  let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(render,180);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(render,60));
}
init();
</script>
